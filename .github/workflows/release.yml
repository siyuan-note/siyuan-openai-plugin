name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check the release version
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";

          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          for (const file of ["package.json", "plugin/plugin.json"]) {
            const {version} = JSON.parse(readFileSync(file, "utf8"));
            assert.equal(version, tag.slice(1), `${file} version must match ${tag}`);
          }
          JS

      - name: Build the plugin
        run: npm run build

      - name: Package the plugin
        working-directory: dist/siyuan-cli
        run: |
          zip -D -X -r ../siyuan-openai-plugin.zip LICENSE plugin.json assets skills
          unzip -t ../siyuan-openai-plugin.zip

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/siyuan-openai-plugin.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SiYuan OpenAI Plugin $GITHUB_REF_NAME" \
            --notes "Download \`siyuan-openai-plugin.zip\` to use SiYuan in a local ChatGPT desktop or Codex session. See the [local installation instructions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#下载与本地安装)."
